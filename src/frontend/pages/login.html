<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập & Đăng Ký - Vĩnh Long Tourist</title>
    <link rel="stylesheet" href="../../public/css/app.css">
    <link rel="stylesheet" href="../resources/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <!-- Header Top -->
        <div class="header-top">
            <div class="container">
                <div class="header-top-content">
                    <div class="info-left">
                        <div class="time-info">
                            <i class="fas fa-clock"></i>
                            <span id="currentTime">10:55:15 16/05/2026</span>
                        </div>
                        <span class="separator">|</span>
                        <div class="weather-info">
                            <i class="fas fa-cloud-sun"></i>
                            <span>Thời tiết</span>
                        </div>
                    </div>
                    <div class="info-right">
                        <div class="language-selector">
                            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGXL5LOxMNK7mqVrfdpmOQjKy5ChGlWpPIg33eqozKNN-9E-KuwVVH8PN1SjkiY2gXd8wNkUpK96ssOZs0yIWnM7OYYveyB1_c1rzI9t8NNDDLF9hNdN-_L68E1vDFAR2KSfhdm2c5KE3HS5nR-Gp6T83QOC7U3EaaKkwFtxbiVkKRDPIgl3RnwJmnnOb2k57aBep0Jf5XYXaRxQ96JuL0WZbcyw4SpEg00kFr1CL5ncgACaCJYWn6jNpELhC-RIrR_U-2m_pNyfA" alt="English" class="flag-icon">
                            <span>English</span>
                            <span class="separator">|</span>
                            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHvkHYDjZe3OZSIlYGDGhoLcmx9dCP7WzTNjb91w-5xKf0Acj-xp0LiPXFGE_tCm1QTwz-3T102fOWOMCa_tOF5mtkHiOOqrwEX8h-d4hclkjZBqu35Eom-Z06uNVvzGAIBsbBzlE-TxluyOTMOSVvjqP9ZInDTjs3nB2aleVFBV6bExVJ6NuppgrptrTKvUAplqUl643QY4r18TZ-_5QUQ0LUv8LHx4UPcVQMgtO2qJ5btAUzehK_tUBFgUt9D1jCxmb6AE1f-js" alt="Vietnamese" class="flag-icon">
                            <span>Tiếng Việt</span>
                        </div>
                        <a href="index.html" class="btn-home">
                            <i class="fas fa-home"></i> TRANG CHỦ
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Header Main -->
        <div class="header-main">
            <div class="container">
                <div class="header-content">
                    <a href="index.html" class="logo">
                        <div class="logo-icon">🧭</div>
                        <div class="logo-text">
                            <div class="logo-name">Vinh Long</div>
                            <div class="logo-tagline">Tourist</div>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="auth-main">
        <div class="auth-container">
            <!-- Auth Tabs -->
            <div class="auth-tabs">
                <button class="tab-btn active" onclick="switchTab('login')">
                    <i class="fas fa-sign-in-alt"></i> ĐĂNG NHẬP
                </button>
                <button class="tab-btn" onclick="switchTab('register')">
                    <i class="fas fa-user-plus"></i> ĐĂNG KÝ
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <h2>Đăng Nhập Tài Khoản</h2>
                
                <div class="form-group">
                    <label for="loginEmail">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="loginEmail" name="email" placeholder="Nhập email của bạn" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> Mật khẩu
                    </label>
                    <input type="password" id="loginPassword" name="password" placeholder="Nhập mật khẩu" required>
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" name="remember"> Ghi nhớ tôi
                    </label>
                    <a href="#">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-sign-in-alt"></i> Đăng Nhập
                </button>

                <div class="divider">Hoặc đăng nhập bằng</div>

                <div class="social-login">
                    <button type="button" class="social-btn facebook" onclick="loginWithFacebook()">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                    <button type="button" class="social-btn google" onclick="loginWithGoogle()">
                        <i class="fab fa-google"></i> Google
                    </button>
                </div>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <h2>Tạo Tài Khoản Mới</h2>
                
                <div class="form-group">
                    <label for="registerName">
                        <i class="fas fa-user"></i> Họ và Tên
                    </label>
                    <input type="text" id="registerName" name="fullname" placeholder="Nhập họ và tên" required>
                </div>

                <div class="form-group">
                    <label for="registerEmail">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="registerEmail" name="email" placeholder="Nhập email" required>
                </div>

                <div class="form-group">
                    <label for="registerPhone">
                        <i class="fas fa-phone"></i> Số điện thoại
                    </label>
                    <input type="tel" id="registerPhone" name="phone" placeholder="Nhập số điện thoại" required>
                </div>

                <div class="form-group">
                    <label for="registerPassword">
                        <i class="fas fa-lock"></i> Mật khẩu
                    </label>
                    <input type="password" id="registerPassword" name="password" placeholder="Tạo mật khẩu mạnh" required>
                </div>

                <div class="form-group">
                    <label for="registerConfirmPassword">
                        <i class="fas fa-lock"></i> Xác nhận mật khẩu
                    </label>
                    <input type="password" id="registerConfirmPassword" name="confirm_password" placeholder="Nhập lại mật khẩu" required>
                </div>

                <div class="form-checkbox">
                    <label>
                        <input type="checkbox" name="terms" required>
                        Tôi đồng ý với <a href="#">Điều khoản sử dụng</a> và <a href="#">Chính sách bảo mật</a>
                    </label>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-user-plus"></i> Tạo Tài Khoản
                </button>

                <div class="divider">Hoặc đăng ký bằng</div>

                <div class="social-login">
                    <button type="button" class="social-btn facebook" onclick="registerWithFacebook()">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                    <button type="button" class="social-btn google" onclick="registerWithGoogle()">
                        <i class="fab fa-google"></i> Google
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Success Notification -->
    <div class="notification" id="successNotification">
        <div class="notification-content">
            <i class="fas fa-check-circle"></i>
            <span id="notificationMessage">Thành công!</span>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>© 2026 Vinh Long Tourist. Bản quyền được bảo vệ. | 
                    <a href="#">Chính sách bảo mật</a> | 
                    <a href="#">Điều khoản sử dụng</a>
                </p>
            </div>
        </div>
    </footer>

    <script src="../js/login.js"></script>
</body>
</html>
